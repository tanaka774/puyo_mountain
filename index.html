<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>ぷよマウンテン</title>
  <meta name="description" content="ただ気ままに連鎖を組み続ける。これまでのとこぷよや対人戦とは違った遊び方がここに！">
  <meta name="keywords" content="puyo, ぷよぷよ, ぷよ, ぷよマウンテン, 連鎖, シミュレータ">
  <link rel="stylesheet" type="text/css" href="./src/styles.css">
</head>

<body>
  <div class="controls">
    <button id="zoom-in">+</button>
    <button id="zoom-out">-</button>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <div class="main-container" id="mainContainer">
      <canvas id="mainCanvas"></canvas>
      <p class="game-info" id="targetChainCount">
        <span class="status-goal" id="statusGoal"></span>
        <span class="status-progress" id="statusProgress"></span>
        <span class="status-bar" id="statusBar"><span class="status-bar-fill" id="statusBarFill"></span></span>
      </p>

    </div>
    <div class="side-container" id="sideContainer">
      <canvas id="nextPuyoCanvas"></canvas>
      <canvas id="VPuyoCanvas"></canvas>
      <div class="stats">
        <div class="game-info" id="chainCount"></div>
        <div class="game-info" id="chainPuyoNum"></div>
        <div class="game-info" id="timer"></div>
      </div>
      <div class="key-hint" id="keyHint"><kbd>P</kbd><span id="keyHintText"></span></div>
    </div>

  </div>

  <div class="title" id="title">
    <h1 class="title-main">ぷよマウンテン<span class="title-seal">山</span></h1>
    <p class="title-sub">PUYO MOUNTAIN</p>
  </div>
  <dialog class="menu-container" id="menu"></dialog>

  <canvas class="canvas-background" id="canvasBackground"></canvas>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
